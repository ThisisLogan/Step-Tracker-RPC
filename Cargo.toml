[package]
name = "discord-rpc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rpc"
path = "src/bin/rpc.rs"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:tray-icon", "dep:directories"]

[dependencies]
# RPC client dependencies
discord-rpc-client = "0.4.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dotenv = "0.15"
eframe = { version = "0.33.3", optional = true }
tray-icon = { version = "0.21.3", optional = true }
anyhow = "1.0.100"
once_cell = "1.21.3"
directories = { version = "6.0.0", optional = true }
