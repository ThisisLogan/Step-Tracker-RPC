name: CI

on:
  push:
  pull_request:

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check RPC
        run: cargo check --bin rpc

      - name: Test RPC
        run: cargo test --bin rpc

      - name: Install Linux GUI deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Test GUI feature
        run: cargo test --features gui --bin gui

  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites
        run: dnf install -y git rust cargo pkgconf-pkg-config glib2-devel gtk3-devel libappindicator-gtk3-devel

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RPC
        run: cargo check --bin rpc

      - name: Test RPC
        run: cargo test --bin rpc

      - name: Test GUI feature
        run: cargo test --features gui --bin gui
