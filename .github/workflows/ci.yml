name: CI

on:
  push:
  pull_request:

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            runs_on: ubuntu-latest
            fedora: false
          - label: macos-latest
            runs_on: macos-latest
            fedora: false
          - label: windows-latest
            runs_on: windows-latest
            fedora: false
          - label: fedora-latest
            runs_on: ubuntu-latest
            fedora: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ !matrix.fedora }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        if: ${{ !matrix.fedora }}
        uses: Swatinem/rust-cache@v2

      - name: Check RPC
        if: ${{ !matrix.fedora }}
        run: cargo check --bin rpc

      - name: Test RPC
        if: ${{ !matrix.fedora }}
        run: cargo test --bin rpc

      - name: Install Linux GUI deps (Ubuntu)
        if: ${{ !matrix.fedora && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev

      - name: Test GUI feature
        if: ${{ !matrix.fedora }}
        run: cargo test --features gui --bin gui

      - name: Fedora tests in container
        if: ${{ matrix.fedora }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            fedora:latest \
            bash -lc '
              dnf install -y git rust cargo pkgconf-pkg-config glib2-devel gtk3-devel libappindicator-gtk3-devel libxdo-devel openssl-devel &&
              cargo check --bin rpc &&
              cargo test --bin rpc &&
              cargo test --features gui --bin gui
            '
