name: CI

on:
  push:
  pull_request:

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check RPC
        run: cargo check --bin rpc

      - name: Test
        run: cargo test --all-targets

      - name: Test GUI feature (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo test --features gui --bin gui

  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install prerequisites
        run: dnf install -y git rust cargo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check RPC
        run: cargo check --bin rpc

      - name: Test
        run: cargo test --all-targets
